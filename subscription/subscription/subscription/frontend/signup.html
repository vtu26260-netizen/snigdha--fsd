<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
<link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #141414;
            color: white;
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: black;
        }

        .logo {
            color: red;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background: red;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            margin: 5px;
        }

        h2 {
            margin-top: 30px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: #222;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

<header>
    <div class="logo">MyFlix</div>

    <div>
        <button onclick="goToAdmin()">Admin</button>
        <button onclick="logout()">Logout</button>
    </div>
</header>

<h2>Dashboard</h2>

<h3 id="welcome"></h3>
<h4 id="plan"></h4>

<div class="cards">
    <div class="card">
        <h3>Basic</h3>
        <p>₹0 / month</p>
        <button onclick="goToPayment('Basic')">Choose</button>
    </div>

    <div class="card">
        <h3>Premium</h3>
        <p>₹199 / month</p>
        <button onclick="goToPayment('Premium')">Choose</button>
    </div>

    <div class="card">
        <h3>Pro</h3>
        <p>₹499 / month</p>
        <button onclick="goToPayment('Pro')">Choose</button>
    </div>
</div>

<script>
/* 🔹 Load user and plan */
window.onload = function () {
    let user = localStorage.getItem("user");

    document.getElementById("welcome").innerText = "Welcome " + user;

    fetch("http://localhost:8081/api/users")
    .then(res => res.json())
    .then(data => {
        let current = data.find(u => u.username === user);

        if (current) {
            document.getElementById("plan").innerText =
                "Your Plan: " + (current.plan || "Not Subscribed");
        }
    });
};

/* 🔹 Go to payment */
function goToPayment(plan) {
    localStorage.setItem("selectedPlan", plan);
    window.location = "payment.html";
}

/* 🔹 Logout */
function logout() {
    localStorage.removeItem("user");
    window.location = "login.html";
}

/* 🔹 Admin page */
function goToAdmin() {
    window.location = "admin.html";
}
</script>

</body>
</html>
<script>
function signup() {
    fetch("http://localhost:8081/api/signup", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: document.getElementById("user").value,
            password: document.getElementById("pass").value
        })
    })
    .then(res => res.json())
    .then(() => {
        alert("Signup successful");
        window.location = "login.html";
    });
}
</script>
